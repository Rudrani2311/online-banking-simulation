# =========================================================
# Default profile: H2 in-memory database (zero-setup, runs instantly)
# Supports cloud deployment via PORT and SPRING_DATASOURCE_* environment variables
# =========================================================
spring.application.name=online-banking-simulation
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bankingsim;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# To switch to MySQL locally, either set environment variables:
#   SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/banking_simulation?createDatabaseIfNotExist=true
#   SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
#   SPRING_DATASOURCE_USERNAME=root
#   SPRING_DATASOURCE_PASSWORD=your_password
# or uncomment the lines below:
# =========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/banking_simulation?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
